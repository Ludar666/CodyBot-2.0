name: Build CodyBot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CODYBOT_SIGNING_KEYSTORE_B64: ${{ secrets.CODYBOT_SIGNING_KEYSTORE_B64 }}
      CODYBOT_SIGNING_STORE_PASSWORD: ${{ secrets.CODYBOT_SIGNING_STORE_PASSWORD }}
      CODYBOT_SIGNING_KEY_ALIAS: ${{ secrets.CODYBOT_SIGNING_KEY_ALIAS }}
      CODYBOT_SIGNING_KEY_PASSWORD: ${{ secrets.CODYBOT_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Test Schemi defaults and foreground fix
        run: python3 tools/patch_test_schema.py

      - name: Prepare persistent signing
        id: signing
        shell: bash
        run: |
          if [ -n "$CODYBOT_SIGNING_KEYSTORE_B64" ] && [ -n "$CODYBOT_SIGNING_STORE_PASSWORD" ] && [ -n "$CODYBOT_SIGNING_KEY_ALIAS" ] && [ -n "$CODYBOT_SIGNING_KEY_PASSWORD" ]; then
            echo "$CODYBOT_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/codybot-release.jks"
            test -s "$RUNNER_TEMP/codybot-release.jks"
            echo "CODYBOT_SIGNING_STORE=$RUNNER_TEMP/codybot-release.jks" >> "$GITHUB_ENV"
            echo "CODYBOT_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "CODYBOT_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Persistent signing secrets are not configured; building debug APK."
          fi

      - name: Build APK
        run: |
          set -o pipefail
          if [ "$CODYBOT_SIGNED" = "true" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          else
            gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodyBot-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        run: |
          if [ "$CODYBOT_SIGNED" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 4 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodyBot-${{ env.CODYBOT_SIGNED == 'true' && 'release-signed-apk' || 'debug-apk' }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

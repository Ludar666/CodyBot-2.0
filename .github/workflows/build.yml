name: Build CodyBot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Repair generated schema test source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/codybot/prototype/CodyAccessibilityService.java')
          s = p.read_text()
          marker = 'private void startSchemaTest(){\\n'
          if marker in s:
              start = s.index(marker)
              end = s.index('\nprivate void runSchemaRead()', start)
              fixed = '''private void startSchemaTest(){
 schemaTestRunning=true;schemaTestPaused=false;schemaTestCapturePending=false;
 if(schemaTestMode==1)runSchemaRead();else if(schemaTestMode==2)runSchemaCoordinateCheck();else if(schemaTestMode==3)runSchemaPositionOverlay();else refreshSchemaTestStatus();
}'''
              s = s[:start] + fixed + s[end:]
              p.write_text(s)
          PY

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodyBot-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 4 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodyBot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

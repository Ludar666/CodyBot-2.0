name: Build CodyBot 3.3 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK packaging and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 4 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          python3 - <<'PY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              info=z.getinfo('resources.arsc')
              print('resources.arsc compress_type =', info.compress_type)
              assert info.compress_type == zipfile.ZIP_STORED, 'resources.arsc is compressed'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CodyBot-3.3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

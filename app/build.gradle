plugins { id 'com.android.application' }

android {
    namespace 'com.codybot.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codybot.app'
        minSdk 24
        targetSdk 30
        versionCode 36
        versionName '3.6'
    }

    androidResources {
        noCompress 'arsc'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

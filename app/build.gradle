plugins { id 'com.android.application' }

android {
    namespace 'com.codybot.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codybot.app'
        minSdk 24
        targetSdk 30
        versionCode 32
        versionName '3.2'
    }

    // Android 11 (API 30) rejects APKs whose resources.arsc is compressed.
    androidResources {
        noCompress 'arsc'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
